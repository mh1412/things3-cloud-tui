name: Release binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
  CARGO_TERM_COLOR: always
  TZ: UTC

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-26
            target: aarch64-apple-darwin
          - platform: macos-amd64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: linux-amd64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal

      # jq <= 1.6 drops trailing .0 in the CLI payload snapshots.
      - name: Install deterministic JSON formatter
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          asset="jq-$PLATFORM"
          mkdir -p "$RUNNER_TEMP/jq-bin"
          curl --fail --location --retry 3 "https://github.com/jqlang/jq/releases/download/jq-1.7.1/$asset" -o "$RUNNER_TEMP/jq-bin/jq"
          chmod +x "$RUNNER_TEMP/jq-bin/jq"
          "$RUNNER_TEMP/jq-bin/jq" --version
          test "$(printf '1700000111.0' | "$RUNNER_TEMP/jq-bin/jq" .)" = '1700000111.0'
          echo "$RUNNER_TEMP/jq-bin" >> "$GITHUB_PATH"

      - name: Test
        run: cargo +1.93.1 test --locked --all-targets

      - name: Build and smoke-test binary
        env:
          TARGET: ${{ matrix.target }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          rustup target add --toolchain 1.93.1 "$TARGET"
          cargo +1.93.1 build --release --locked --target "$TARGET"
          "target/$TARGET/release/things3" --version
          "target/$TARGET/release/things3" tui --help

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p package dist
          cp "target/$TARGET/release/things3" package/things3
          cp LICENSE package/LICENSE
          tar -czf "dist/things3-${RELEASE_TAG}-${PLATFORM}.tar.gz" -C package things3 LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach binaries and checksums
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz > SHA256SUMS

      - name: Upload to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
